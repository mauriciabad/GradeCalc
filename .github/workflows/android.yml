name: Android (TWA)

on:
  # Check that the Android app still builds whenever its config changes
  # (including Dependabot PRs that bump Bubblewrap / target SDK).
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  # Release: Actions tab -> "Android (TWA)" -> Run workflow.
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track to upload to ("none" = only build the signed AAB)'
        type: choice
        default: production
        options: [none, internal, alpha, beta, production]
      manual_review_submission:
        description: >-
          Don't send for review automatically. Needed when Play says "Changes cannot be sent for review
          automatically" (e.g. other pending changes in Play Console); then click "Send for review" in
          Play Console → Publishing overview.
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: android/package-lock.json

      # Bubblewrap requires exactly JDK 17 (also fine for AGP 9).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          # The Gradle project is generated, so key the cache on what determines its versions.
          cache-dependency-path: |
            android/package-lock.json
            android/patch-project.js

      - run: npm ci

      - name: Decode upload keystore
        if: env.HAS_UPLOAD_KEY == 'true' && github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh
        env:
          UPLOAD_KEY_ALIAS: gradecalc-keystore-2
          UPLOAD_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.UPLOAD_KEYSTORE_PASSWORD || '' }}
          UPLOAD_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.UPLOAD_KEY_PASSWORD || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: gradecalc-android
          path: android/out/
          if-no-files-found: error

      - name: Upload to Google Play
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.track != 'none' &&
          env.HAS_UPLOAD_KEY == 'true' && env.HAS_PLAY_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.mauriciabad.app.gradecalc
          releaseFiles: android/out/*.aab
          tracks: ${{ inputs.track }}
          status: completed
          changesNotSentForReview: ${{ inputs.manual_review_submission }}
