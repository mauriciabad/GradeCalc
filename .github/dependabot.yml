version: 2
updates:
  # Website build tools. The "Deploy to GitHub Pages" workflow builds and tests each PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      website:
        patterns: ['*']

  # New Bubblewrap releases bring new target SDK / androidbrowserhelper versions.
  # The "Android (TWA)" workflow builds each PR to confirm it still works.
  - package-ecosystem: npm
    directory: /android
    schedule:
      interval: weekly
    groups:
      bubblewrap:
        patterns: ['@bubblewrap/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
